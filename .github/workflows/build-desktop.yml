name: Build Desktop Apps

# Triggers on version tags like v1.0.0, v1.2.3, etc.
# Also runnable manually from GitHub Actions UI.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact_name: TransformStudio-mac.dmg
            artifact_path: dist/TransformStudio-mac.dmg

          - os: windows-latest
            platform: windows
            artifact_name: TransformStudio-windows.zip
            artifact_path: dist/TransformStudio-windows.zip

          - os: ubuntu-latest
            platform: linux
            artifact_name: TransformStudio-linux.tar.gz
            artifact_path: dist/TransformStudio-linux.tar.gz

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node / frontend ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # ── Python / backend ──────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt pyinstaller typer httpx rich keyring

      # ── PyInstaller ───────────────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm transform_studio.spec

      # ── Mac: create DMG ───────────────────────────────────────────────────────
      - name: Create DMG (Mac only)
        if: matrix.platform == 'mac'
        run: |
          # ts binary is inside the .app at Contents/MacOS/ts — no extra steps needed
          hdiutil create \
            -volname "Transform Studio" \
            -srcfolder "dist/TransformStudio.app" \
            -ov -format UDZO \
            "dist/TransformStudio-mac.dmg"

      # ── Windows: bundle ts.exe alongside TransformStudio.exe ─────────────────
      - name: Bundle ts.exe (Windows only)
        if: matrix.platform == 'windows'
        run: |
          # Both TransformStudio.exe and ts.exe are already in dist/ from PyInstaller
          Compress-Archive -Path dist/TransformStudio.exe, dist/ts.exe -DestinationPath dist/TransformStudio-windows.zip
        shell: pwsh

      # ── Linux: create tar.gz ──────────────────────────────────────────────────
      - name: Create tar.gz (Linux only)
        if: matrix.platform == 'linux'
        run: tar -czf dist/TransformStudio-linux.tar.gz -C dist TransformStudio

      # ── Upload artifact ───────────────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # ── Create GitHub Release with all three files ─────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Transform Studio ${{ github.ref_name }}"
          body: |
            ## Dremio Transform Studio ${{ github.ref_name }}

            ### Download for your platform:
            | Platform | File |
            |----------|------|
            | 🍎 Mac   | `TransformStudio-mac.dmg` |
            | 🪟 Windows | `TransformStudio-windows.zip` |
            | 🐧 Linux | `TransformStudio-linux.tar.gz` |

            ### Mac install
            1. Download `TransformStudio-mac.dmg`
            2. Open it → drag **TransformStudio** to Applications
            3. Click the app — browser opens automatically
            4. The `ts` CLI is installed to your PATH automatically on first launch

            ### Windows install
            1. Download `TransformStudio-windows.zip` and extract it
            2. Double-click `TransformStudio.exe` — app opens in your browser
            3. Add the extracted folder to your PATH to use the `ts` CLI

            ### Linux install
            ```bash
            tar -xzf TransformStudio-linux.tar.gz
            ./TransformStudio/TransformStudio
            # ts is symlinked to /usr/local/bin/ts automatically on first launch
            ```

            ### Claude Code / AI agent usage
            The `ts` CLI is bundled with the app. Once it's on your PATH:
            ```bash
            ts context dump          # feed full environment context to an AI agent
            ts pipeline list         # list all pipelines
            ts agent chat "..."      # talk to the built-in AI agent
            ```

            > **Note:** Configure your Dremio connection via the ⚙️ Settings icon after first launch.
          files: |
            release-assets/**/*
          draft: false
          prerelease: false
