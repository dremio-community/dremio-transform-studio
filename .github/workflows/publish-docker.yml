name: Publish Docker Image

# Runs when a version tag is pushed (e.g. v1.0.0)
# Also runnable manually from GitHub Actions UI.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker tag to push (e.g. 1.0.0)'
        required: false
        default: 'latest'

env:
  # Change DOCKER_IMAGE to your Docker Hub username/repo
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/transform-studio

jobs:
  docker:
    runs-on: ubuntu-latest
    name: Build & Push Docker Image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Extract version from tag (v1.2.3 → 1.2.3)
      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64   # Intel + Apple Silicon servers
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_IMAGE }}
          short-description: 'Dremio Transform Studio — low-code SQL pipeline builder'
