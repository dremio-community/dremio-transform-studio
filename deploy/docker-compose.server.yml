version: '3.9'

# ── Dremio Transform Studio — Shared Server Deployment ───────────────────────
# Multi-user setup: nginx handles SSL + domain, app runs behind it.
#
# Setup:
#   1. Point your domain's DNS A record to this server's IP
#   2. Set DOMAIN and EMAIL in .env (copy from .env.example)
#   3. docker compose -f docker-compose.server.yml up -d
#
# Access: https://transforms.yourcompany.com

services:

  # ── App ─────────────────────────────────────────────────────────────────────
  transform-studio:
    image: mshainman/transform-studio:latest
    container_name: transform-studio
    restart: unless-stopped
    volumes:
      - ts-data:/data
    environment:
      - DB_PATH=/data/transforms.db
    expose:
      - "8000"
    networks:
      - internal

  # ── nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ts-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # place your SSL certs here
      - certbot-www:/var/www/certbot:ro        # for Let's Encrypt
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - transform-studio
    networks:
      - internal

  # ── Certbot (free SSL via Let's Encrypt) ────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: ts-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Renew certs automatically every 12 hours
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"

volumes:
  ts-data:
  certbot-www:
  certbot-certs:

networks:
  internal:
