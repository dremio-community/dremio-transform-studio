worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip for faster load times
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── HTTP: redirect to HTTPS + handle Let's Encrypt challenges ────────────
    server {
        listen 80;
        server_name transforms.yourcompany.com;   # ← change to your domain

        # Let's Encrypt webroot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name transforms.yourcompany.com;   # ← change to your domain

        ssl_certificate     /etc/letsencrypt/live/transforms.yourcompany.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/transforms.yourcompany.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer-when-downgrade;

        # Proxy all traffic to the app
        location / {
            proxy_pass         http://transform-studio:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 120s;
        }
    }
}
