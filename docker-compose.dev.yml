version: '3.9'

# ── Development mode (hot reload) ─────────────────────────────────────────────
# Frontend on :5173 with HMR, backend running separately on :8000
#   docker compose -f docker-compose.dev.yml up

services:
  frontend-dev:
    image: node:20-alpine
    container_name: transform-studio-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
